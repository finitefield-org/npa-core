[package]
name = "npa-api"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
planning-benchmark = ["npa-package/planning-benchmark"]

[dependencies]
npa-cert = { path = "../npa-cert" }
npa-checker-ref = { path = "../npa-checker-ref" }
npa-frontend = { path = "../npa-frontend" }
npa-kernel = { path = "../npa-kernel" }
npa-package = { path = "../npa-package" }
npa-tactic = { path = "../npa-tactic" }
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
# The exact task-named planning tests consume the same operation-owned counter
# sinks as the closed release benchmark without enabling the public benchmark
# adapter in ordinary library builds.
npa-package = { path = "../npa-package", features = ["planning-benchmark"] }

[[example]]
name = "bench_package_linear_dag"
required-features = ["planning-benchmark"]

[build-dependencies]
sha2 = "0.10"
